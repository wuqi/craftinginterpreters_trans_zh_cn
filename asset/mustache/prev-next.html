<div class="prev-next">
  {{# has_prev }}
    <a href="{{ prev_file }}.html" title="{{ display_prev }}" class="left">&larr;&nbsp;{{ ui_previous }}</a>
  {{/ has_prev }}
  {{# has_up }}
    <a href="{{ up_file }}.html" title="{{ display_up }}">&uarr;&nbsp;{{ ui_up }}</a>
  {{/ has_up }}
  {{# has_next }}
    <a href="{{ next_file }}.html" title="{{ display_next }}" class="right">{{ ui_next }}&nbsp;&rarr;</a>
  {{/ has_next }}
</div>
